.sk code{display:block;margin-top:3px;font-size:9.5px;color:var(--dim);word-break:break-all}
.bz{position:absolute;inset:4px 4px auto 4px;display:flex;justify-content:space-between;pointer-events:none}
.own,.eq{font-size:9.5px;padding:1px 6px;border-radius:99px;color:#fff;line-height:1.5}
.own{background:#1f7a4d;margin-left:auto}
.eq{background:#2b5fb8;margin-right:auto}
.panel[hidden]{display:none}
.cnt{color:var(--dim);font-size:12.5px;margin:0 0 12px}
body.onlyown .sk[data-own="0"]{display:none}

<script>
const tabs=[...document.querySelectorAll('.tab')];
function sel(k){tabs.forEach(t=>{const on=t.dataset.k===k;t.setAttribute('aria-selected',on);
 document.getElementById('p-'+t.dataset.k).hidden=!on});
 try{localStorage.setItem('skindex.tab',k)}catch(e){}}
tabs.forEach(t=>t.onclick=()=>sel(t.dataset.k));
let init='pet';try{init=localStorage.getItem('skindex.tab')||'pet'}catch(e){}
if(!tabs.some(t=>t.dataset.k===init))init='pet';
sel(init);
const cb=document.getElementById('onlyown');
function applyOnly(){document.body.classList.toggle('onlyown',cb.checked);
 try{localStorage.setItem('skindex.onlyown',cb.checked?'1':'0')}catch(e){}}
try{cb.checked=localStorage.getItem('skindex.onlyown')==='1'}catch(e){}
cb.onchange=applyOnly;applyOnly();
</script></body></html>
